# MindGraph++ Multimodal Model Architecture (MP3 Part 1)

model:
  version: "1.0.0"
  registry_id: MODEL_010
  latent_dim: 512
  dropout: 0.1
  modality_dropout: 0.3
  gradient_checkpointing: false
  mixed_precision: auto  # fp32 | fp16 | bf16 | auto

audio:
  encoder: wav2vec_projection
  input_dim: 768
  hidden_dim: 512
  num_layers: 2
  max_seq_len: 4096

visual:
  encoder: vit_projection
  input_dim: 768
  hidden_dim: 512
  num_layers: 2
  max_seq_len: 128

text:
  encoder: transformer_projection
  input_dim: 768
  hidden_dim: 512
  num_layers: 2
  max_seq_len: 512

image:
  encoder: cnn_projection
  input_dim: 512
  hidden_dim: 512
  num_layers: 2

fusion:
  architecture: cross_modal_transformer
  d_model: 512
  num_heads: 8
  num_layers: 2
  temporal_layers: 1

graph:
  architecture: graphsage
  hidden_dim: 256
  num_layers: 2
  kg_injection: true

heads:
  multi_task: true
  num_classes: 2
  risk_levels: 3
  hidden_dim: 256

checkpoint:
  directory: ml_pipeline/weights
  save_top_k: 3
  save_every_n_epochs: 5

export:
  formats: [pytorch, torchscript, onnx]
  onnx_opset: 17
