[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindgraph-plus-plus"
version = "0.1.0"
description = "Privacy-preserving multilingual multimodal longitudinal depression intelligence platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "MindGraph++ Contributors" }]
keywords = ["healthcare", "depression", "knowledge-graph", "multimodal", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "neo4j>=5.26.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "isort>=5.13.0",
    "httpx>=0.28.0",
]
ml = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "transformers>=4.46.0",
    "torchmetrics>=1.6.0",
    "pytorch-lightning>=2.4.0",
    "librosa>=0.10.2",
    "opencv-python-headless>=4.10.0",
    "mediapipe>=0.10.18",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "optuna>=4.1.0",
    "onnx>=1.17.0",
    "tensorboard>=2.18.0",
    "mlflow>=2.18.0",
    "hydra-core>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '/(\.venv|venv|build|dist)/'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "ml_pipeline", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml_pipeline"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend"]

[tool.bandit]
exclude_dirs = ["tests", "backend/tests", ".venv"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "ml_pipeline"]
