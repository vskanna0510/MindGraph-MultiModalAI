# MindGraph++ Monitoring Stack

name: mindgraph-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mindgraph-prometheus
    restart: unless-stopped
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mindgraph-monitoring

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mindgraph-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - mindgraph-monitoring

  loki:
    image: grafana/loki:3.3.2
    container_name: mindgraph-loki
    restart: unless-stopped
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - mindgraph-monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: mindgraph-alertmanager
    restart: unless-stopped
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - mindgraph-monitoring

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  mindgraph-monitoring:
    driver: bridge
