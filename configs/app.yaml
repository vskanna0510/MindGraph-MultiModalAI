# MindGraph++ Application Configuration
# Environment-specific overrides via APP_ENV

app:
  name: MindGraph++
  version: "0.1.0"
  api_version: v1
  debug: false

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: true  # development only

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["*"]

rate_limit:
  enabled: true
  requests_per_minute: 120

health:
  include_dependencies: true
