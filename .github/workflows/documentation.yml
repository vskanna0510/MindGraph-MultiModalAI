name: Documentation

on:
  push:
    branches: [main, develop]
    paths: ['docs/**', 'backend/docs/**', 'README.md']
  pull_request:
    branches: [main, develop]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/devops/generate_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: reports/generated/
