# Graph cache configuration

graph_cache:
  enabled: true
  default_ttl_seconds: 300
  max_entries: 1000

keys:
  user_graph: "graph:user:{user_id}"
  session_graph: "graph:session:{session_id}"
  prediction_graph: "graph:prediction:{user_id}"
  temporal_query: "graph:temporal:{user_id}:{window}"
  recommendations: "graph:rec:{user_id}"
  embeddings: "graph:emb:{node_id}"

invalidation:
  on_user_update: true
  on_session_update: true
  on_prediction_update: true
