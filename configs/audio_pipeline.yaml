# MindGraph++ Audio Engineering Pipeline (MP2 Part 3)

pipeline:
  version: "1.0.0"
  feature_version: "v1"
  deterministic: true
  seed: 42
  skip_stages: []  # never skip in production

audio:
  target_sample_rate: 16000
  supported_rates: [8000, 16000, 22050, 44100, 48000]
  mono: true
  formats: [wav, flac, mp3, ogg, m4a, aac]
  min_duration_seconds: 0.5
  max_duration_seconds: 3600

resampling:
  method: kaiser_best
  quality: high

amplitude:
  method: peak  # peak | rms | lufs
  target_peak: 0.95
  target_rms: 0.1
  target_lufs: -23.0

noise_reduction:
  enabled: true
  method: spectral_gating  # spectral_gating | wiener | adaptive
  max_suppression_db: 12

vad:
  method: energy  # energy | webrtc | silero
  frame_ms: 30
  energy_threshold: 0.02

segmentation:
  max_segment_seconds: 30.0
  overlap_seconds: 0.5
  min_segment_seconds: 0.5
  padding_seconds: 0.1

features:
  mfcc_coeffs: 13
  n_mels: 128
  hop_length: 512
  n_fft: 2048
  include_delta: true
  include_delta_delta: true
  extract_prosody: true
  extract_pitch: true

embeddings:
  primary: facebook/wav2vec2-base
  model_version: "1.0"
  batch_size: 8
  device: auto  # auto | cpu | cuda
  cache_subdir: wav2vec2

normalization:
  method: zscore  # zscore | minmax | robust | quantile
  per_split: true

augmentation:
  enabled: false  # training only
  time_stretch_prob: 0.0
  pitch_shift_prob: 0.0
  noise_prob: 0.0
  spec_augment_prob: 0.0

cache:
  root: datasets/cache
  key_fields: [audio_hash, model_version, config_version]

export:
  formats: [numpy, torch, parquet]
  lazy_loading: true

multiprocessing:
  enabled: true
  max_workers: 0

quality:
  min_overall_score: 0.4
  max_silence_ratio: 0.85
  max_clipping_ratio: 0.05

paths:
  processed_root: datasets/processed/audio_features
  reports_root: datasets/reports/audio
  metadata_file: audio_metadata.parquet
