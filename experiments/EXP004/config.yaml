experiment:
  id: fusion
  name: cross_modal_fusion
  description: Cross-attention multimodal fusion experiment
  tags:
  - fusion
  - multimodal
model:
  architecture: cross_modal_transformer
  fusion_mode: cross_attn
  d_model: 512
  num_heads: 8
  num_layers: 2
  modalities:
  - audio
  - video
  - text
  - image
  modality_dropout: 0.3
training:
  seed: 42
  epochs: 100
  batch_size: 16
  num_workers: 4
  early_stopping_patience: 10
  gradient_clip_norm: 1.0
dataset:
  name: daic_woz
  version: 1.0.0
  modalities:
  - audio
  - text
optimization:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
evaluation:
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - weighted_f1
  - roc_auc
  - pr_auc
  - mcc
  threshold: 0.5
deployment:
  export_formats:
  - pytorch
  - onnx
  - torchscript
  onnx_opset: 17
reproducibility:
  deterministic: true
