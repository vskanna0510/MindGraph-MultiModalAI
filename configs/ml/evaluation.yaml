# Evaluation and benchmarking configuration

experiment:
  id: evaluation
  name: model_evaluation_suite
  description: Standard evaluation protocol for all MindGraph++ models
  tags: [evaluation, ieee, reproducibility]

evaluation:
  metrics:
    classification:
      - accuracy
      - precision
      - recall
      - specificity
      - sensitivity
      - f1
      - weighted_f1
      - macro_f1
      - micro_f1
      - roc_auc
      - pr_auc
      - mcc
      - cohen_kappa
    calibration:
      - ece
    systems:
      - inference_time_ms
      - memory_peak_mb
      - model_size_mb
  statistical_tests:
    - paired_t_test
    - wilcoxon
    - mcnemar
  confidence_level: 0.95
  figure_dpi: 300
  figure_formats: [png, svg]

comparison:
  baselines:
    - audio_only
    - video_only
    - text_only
    - image_only
    - fusion
    - fusion_graph
    - fusion_graph_temporal
  generate_tables: true
  generate_latex: false

reports:
  output_dir: reports/evaluation
  formats: [markdown, json]
  include_limitations: true
  include_future_work: true
