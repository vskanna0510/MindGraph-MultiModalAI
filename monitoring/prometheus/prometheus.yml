global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mindgraph-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    scrape_interval: 30s
