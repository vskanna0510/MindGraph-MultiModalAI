experiment:
  id: audio_only
  name: audio_modality_baseline
  description: Audio-only depression screening experiment
  tags:
  - audio
  - ablation
model:
  architecture: audio_encoder
  encoder: wav2vec2-base
  hidden_dim: 256
  dropout: 0.2
training:
  seed: 42
  epochs: 80
  batch_size: 32
  num_workers: 4
  early_stopping_patience: 8
  gradient_clip_norm: 1.0
dataset:
  name: daic_woz
  version: 1.0.0
  modalities:
  - audio
  sample_rate: 16000
  max_duration_seconds: 300
optimization:
  optimizer: adamw
  learning_rate: 5.0e-05
  weight_decay: 0.01
  scheduler: reduce_on_plateau
evaluation:
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - roc_auc
  threshold: 0.5
deployment:
  export_formats:
  - pytorch
  - onnx
  - tflite
  onnx_opset: 17
reproducibility:
  deterministic: true
