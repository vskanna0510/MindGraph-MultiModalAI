seed: 42
epochs: 100
batch_size: 16
num_workers: 4
learning_rate: 0.0001
weight_decay: 0.01
optimizer: adamw
scheduler: cosine
warmup_epochs: 5
gradient_clip_norm: 1.0
early_stopping_patience: 10
mixed_precision: auto
distributed: false
gradient_checkpointing: false

checkpoint:
  best_loss: true
  best_accuracy: true
  best_f1: true
  best_auc: true
  latest: true
  every_n_epochs: 5

logging:
  metrics: [loss, accuracy, precision, recall, f1, roc_auc, gpu_memory, train_time, val_time]
